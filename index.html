<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>For You Babi ❤️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; }
  body {
    background: radial-gradient(circle at 50% 35%, #ff5f8d 0%, #c2185b 42%, #4a0e2e 100%);
    color:#fff; user-select:none; touch-action:manipulation;
  }
  .stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; }
  h1 { font-size:clamp(1.5rem, 7vw, 2.5rem); font-weight:700; margin-bottom:4px; text-shadow:0 2px 14px rgba(0,0,0,.4); opacity:0; animation:fade 1.5s .3s forwards; }
  .sub { font-size:clamp(.9rem, 3.8vw, 1.15rem); opacity:0; margin-bottom:22px; min-height:1.5em; animation:fade 1.5s 1.2s forwards; }
  .couple { display:flex; align-items:center; justify-content:center; gap:4px; width:100%; }
  .photo {
    width:clamp(110px, 36vw, 190px); height:clamp(110px, 36vw, 190px); border-radius:50%;
    object-fit:cover; border:4px solid #fff; cursor:pointer;
    box-shadow:0 0 0 6px rgba(255,255,255,.25), 0 10px 35px rgba(0,0,0,.45), 0 0 40px rgba(255,150,190,.7);
    transition:transform .15s;
  }
  .photo:active { transform:scale(.92); }
  .photo.her { object-position:50% 25%; animation:sway 4s ease-in-out infinite; }
  .photo.him { object-position:50% 30%; animation:sway 4s ease-in-out infinite reverse; }
  #bigHeart {
    font-size:clamp(2.6rem, 11vw, 4.2rem); cursor:pointer; line-height:1; z-index:3;
    animation:beat 1.2s infinite; filter:drop-shadow(0 0 20px rgba(255,255,255,.7));
    margin:0 -6px;
  }
  .names { margin-top:14px; display:flex; justify-content:center; gap:clamp(40px,16vw,90px); font-weight:600; font-size:clamp(1rem,4.2vw,1.25rem); text-shadow:0 2px 8px rgba(0,0,0,.4); opacity:0; animation:fade 1.5s 1.6s forwards; }
  .hint { margin-top:22px; font-size:.95rem; opacity:.85; animation:blink 2s infinite; }
  .counter { position:fixed; bottom:16px; left:0; right:0; text-align:center; font-size:.9rem; opacity:.85; }
  .float-heart { position:fixed; bottom:-40px; pointer-events:none; opacity:.8; animation:rise linear forwards; z-index:1; }
  .burst { position:fixed; pointer-events:none; z-index:5; animation:burst 1.1s ease-out forwards; }
  .msg { position:fixed; pointer-events:none; z-index:10; font-weight:700; white-space:nowrap; text-shadow:0 2px 10px rgba(0,0,0,.5); animation:msgUp 2.4s ease-out forwards; }
  .ripple { position:fixed; border:3px solid rgba(255,255,255,.8); border-radius:50%; pointer-events:none; z-index:4; animation:ripple .9s ease-out forwards; }
  #letter { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:rgba(40,0,20,.78); backdrop-filter:blur(6px); padding:22px; }
  .paper { background:linear-gradient(160deg,#fff8f0,#ffe3ec); color:#6b1033; max-width:420px; width:100%; padding:26px 24px; border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:pop .6s cubic-bezier(.2,1.4,.4,1); line-height:1.7; font-size:1.02rem; text-align:center; max-height:88vh; overflow-y:auto; }
  .paper img { width:90px; height:90px; border-radius:50%; object-fit:cover; object-position:50% 25%; border:3px solid #e91e63; margin-bottom:8px; }
  .paper h2 { margin-bottom:10px; font-size:1.4rem; }
  .paper p { text-align:left; white-space:pre-line; }
  .paper button { margin-top:16px; background:#e91e63; color:#fff; border:0; padding:10px 22px; border-radius:999px; font-size:1rem; cursor:pointer; }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.2)} 30%{transform:scale(1)} 45%{transform:scale(1.14)} }
  @keyframes sway { 0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-8px) rotate(1.5deg)} }
  @keyframes fade { to { opacity:1 } }
  @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }
  @keyframes rise { to { transform:translateY(-115vh) rotate(25deg); opacity:0 } }
  @keyframes burst { 0%{transform:translate(0,0) scale(.4); opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(var(--r)); opacity:0} }
  @keyframes msgUp { 0%{transform:translate(-50%,0) scale(.5); opacity:0} 15%{transform:translate(-50%,-10px) scale(1.1); opacity:1} 100%{transform:translate(-50%,-110px) scale(1); opacity:0} }
  @keyframes ripple { 0%{width:0;height:0;opacity:1;transform:translate(-50%,-50%)} 100%{width:220px;height:220px;opacity:0;transform:translate(-50%,-50%)} }
  @keyframes pop { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }
</style>
</head>

    <button onclick="closeLetter()">Close ❤️</button>
  </div>
</div>

<script>
const HER_NAME = "Abhimani";
const NICK = "Babi";
const HIS_NAME = "Me";
const LETTER = `I love you babi, man oyata godak adarey.\n\nOya parana dewal hama deyakma amathaka karala danna oyata dan man innawa. Mata oya wena kawawath wadak na.\n\nApi denna essaraha gana hithala hodata wada karamu. Man ema salli thiyana kollek nama habay, mata puluwan upariman man oyawa bala ganna try karanawa. Api denna hodata A/L karala pass wemu, okey 🥰\n\nMan oyata boruwak karanna na, man ehama kollek nama. Man danna mechcharay. Man oyata godak adarey 😘\n\nI love you manika 🥹❤️‍🩹`;

const msgs = [
  "I love you Babi ❤️", "මම ඔයාට ආදරෙයි බබා 💕", "You are my everything 💖",
  "ඔයා මගේ ලෝකේ 🌍❤️", "Forever yours Abhimani 💘", "Mage hithe oya withrai 😍",
  "Love you so much Babi 💗", "ආදරෙයි බබා 😘", "You make me smile 😊", "My heart is yours 💝",
  "Abhimani ❤️ Babi", "Mage babi 🥰"
];
const emojis = ["❤️","💖","💕","💗","💘","💝","🌹","✨","💞"];
const colors = ["#fff","#ffe0ec","#ffd1dc","#fff3b0","#ffffff"];

document.getElementById('letterText').innerText = LETTER + (HIS_NAME && HIS_NAME !== "Me" ? "\n\n— " + HIS_NAME : "");

const subText = "I love you Manika 💕";
const sub = document.getElementById('sub');
let i = 0;
setTimeout(function type(){ if(i<subText.length){ sub.textContent += subText[i++]; setTimeout(type,55);} }, 1300);

function floatHeart(){
  const h = document.createElement('div');
  h.className = 'float-heart';
  h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left = Math.random()*100 + 'vw';
  h.style.fontSize = (14 + Math.random()*28) + 'px';
  h.style.animationDuration = (6 + Math.random()*6) + 's';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(), 12500);
}
setInterval(floatHeart, 350);
for(let k=0;k<8;k++) setTimeout(floatHeart, k*150);

let taps = 0, letterShown = false;
const counter = document.getElementById('counter');

function showMessage(x, y){
  const m = document.createElement('div');
  m.className = 'msg';
  m.textContent = msgs[Math.floor(Math.random()*msgs.length)];
  m.style.left = Math.min(Math.max(x, 120), innerWidth-120) + 'px';
  m.style.top = (y - 20) + 'px';
  m.style.fontSize = (20 + Math.random()*8) + 'px';
  m.style.color = colors[Math.floor(Math.random()*colors.length)];
  document.body.appendChild(m);
  setTimeout(()=>m.remove(), 2500);
}
function burst(x, y, count){
  for(let k=0;k<count;k++){
    const b = document.createElement('div');
    b.className = 'burst';
    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const ang = Math.random()*Math.PI*2, dist = 70 + Math.random()*130;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.fontSize = (16 + Math.random()*20) + 'px';
    b.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    b.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
    b.style.setProperty('--r', (Math.random()*120-60) + 'deg');
    document.body.appendChild(b);
    setTimeout(()=>b.remove(), 1200);
  }
}
function ripple(x, y){
  const r = document.createElement('div');
  r.className = 'ripple'; r.style.left = x+'px'; r.style.top = y+'px';
  document.body.appendChild(r); setTimeout(()=>r.remove(), 950);
}
function closeLetter(){ document.getElementById('letter').style.display='none'; }

document.addEventListener('pointerdown', e => {
  if(e.target.closest('#letter')) return;
  const x = e.clientX, y = e.clientY;
  const big = e.target.id === 'bigHeart' || e.target.classList.contains('photo');
  ripple(x, y);
  burst(x, y, big ? 22 : 12);
  showMessage(x, y);
  if(navigator.vibrate) navigator.vibrate(big ? [30,40,30] : 25);
  taps++;
  counter.textContent = "❤️ x " + taps;
  if(taps === 10 && !letterShown){
    letterShown = true;
    setTimeout(()=>{ document.getElementById('letter').style.display='flex'; }, 700);
  }
});
</script>
</body>
</html>
